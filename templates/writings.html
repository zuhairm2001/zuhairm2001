<!doctype html>
<html lang="en">
    <head>
        <title>writings | zuhairmalik</title>
        <link rel="stylesheet" href="/static/style.css" />
        <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    </head>
    <body class="has-site-menu">
        <nav class="site-menu" aria-label="Primary navigation">
            <a class="site-menu__brand" href="/">zuhairmalik</a>
            <ul class="site-menu__links">
                <li><a href="/writings">writings</a></li>
            </ul>
        </nav>
        <div class="container">
            <h1>writings</h1>
            <ul class="writings-list">
                {{range .Posts}}
                <li>
                    <a href="/writing/{{.Date}}/{{.Slug}}">{{.Title}}</a>
                    <span class="date">{{.Date}}</span>
                </li>
                {{end}}
            </ul>
            <p><a href="/">back home</a></p>
        </div>
    </body>
</html>
